services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: dlu-chatbot-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - dlu_data:/app/data
      - dlu_vector_store:/app/vector_store
      - dlu_model_cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    container_name: dlu-chatbot-dashboard
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8511:8511"
    volumes:
      - ./.env:/app/.env
      - dlu_data:/app/data
      - dlu_vector_store:/app/vector_store
      - dlu_model_cache:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8511/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  dlu_data:
  dlu_vector_store:
  dlu_model_cache:
